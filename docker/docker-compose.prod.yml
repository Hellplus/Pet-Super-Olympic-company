version: '3.8'

services:
  # ========== PostgreSQL ==========
  postgres:
    image: postgres:15-alpine
    container_name: ipoc-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ipoc_admin}
      POSTGRES_USER: ${DB_USERNAME:-ipoc}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ipoc123456}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-ipoc} -d ${DB_DATABASE:-ipoc_admin}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ipoc-network

  # ========== Redis ==========
  redis:
    image: redis:7-alpine
    container_name: ipoc-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-ipoc123456}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-ipoc123456}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ipoc-network

  # ========== Backend (NestJS) ==========
  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    container_name: ipoc-backend
    restart: always
    environment:
      NODE_ENV: production
      APP_PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-ipoc}
      DB_PASSWORD: ${DB_PASSWORD:-ipoc123456}
      DB_DATABASE: ${DB_DATABASE:-ipoc_admin}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ipoc123456}
      JWT_SECRET: ${JWT_SECRET:-please-change-this-secret-in-production}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-15m}
      JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES:-7d}
    volumes:
      - upload_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ipoc-network

  # ========== Frontend (Nginx) ==========
  frontend:
    build:
      context: ..
      dockerfile: apps/frontend/Dockerfile
    container_name: ipoc-frontend
    restart: always
    ports:
      - '${APP_PORT:-80}:80'
    depends_on:
      - backend
    networks:
      - ipoc-network

volumes:
  postgres_data:
  redis_data:
  upload_data:

networks:
  ipoc-network:
    driver: bridge
